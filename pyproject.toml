[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eosbench"
version = "0.1.0"
description = "ML training benchmarks for the Ersilia Open Source Initiative"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name="Miquel Duran-Frigola", email="miquel@ersilia.io"}
]
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "loguru>=0.6",
  "rich>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "flake8",
]
# Tooling for building new datasets (scripts/prepare_*.py). Not needed to consume eosbench.
prepare = [
  # Pinned: rdkit>=2026.3 raises RuntimeError("bad bond stereo") in
  # MurckoScaffold.MurckoScaffoldSmiles for a narrow class of cross-conjugated stereo
  # bonds (e.g. some tdcommons/ames molecules) that 2025.9.x handles fine. Re-evaluate
  # the pin once that regression is fixed upstream.
  "rdkit==2025.9.6",
  "scikit-learn",
  "polaris-lib",
  # Pinned: PyTDC>=1.0 pulls in an unrelated, much heavier dependency tree (transformers,
  # datasets, cellxgene-census, ...) for modalities eosbench doesn't use, and several 1.x
  # releases don't support Python 3.12; some don't even install (cellxgene-census pin
  # orphaned on PyPI). 0.3.6 is the newest release that is both Python-3.12-compatible
  # and installable.
  "PyTDC==0.3.6",
]

[project.scripts]
eosbench = "eosbench.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eosbench" = ["_data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

